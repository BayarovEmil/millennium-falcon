services:
  postgres:
    image: postgres:16
    container_name: planner-postgres
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports:
      # Host port 5433, not 5432 - avoids clashing with a native Postgres install on the host.
      - "5433:5432"
    volumes:
      - planner-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  planner-postgres-data:
